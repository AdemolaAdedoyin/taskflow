name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
      REDIS_URL: redis://localhost:6379
      TASKFLOW_API_KEY: ci-test-key
      TASKFLOW_API_CLIENTS: writer:writer-ci-secret:jobs.read|jobs.write,reader:reader-ci-secret:jobs.read,operator:operator-ci-secret:operations.read
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to a fresh database
        run: npm run prisma:deploy

      - name: Run unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build migration container
        run: docker build --target migrator -t taskflow-migrator:ci .

      - name: Build production container
        run: docker build -t taskflow:ci .
