services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5433:5432" # offset from webhook-relay so both stacks can run side by side
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    command: npm run prisma:deploy
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    init: true
    command: node dist/index.js
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      PORT: 4000
      TASKFLOW_API_CLIENTS: ${TASKFLOW_API_CLIENTS:-local:dev-local-client-secret:*}
      TASKFLOW_API_KEY: ${TASKFLOW_API_KEY:-dev-local-key}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/live').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    init: true
    command: node dist/queue/worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      TASKFLOW_API_CLIENTS: ${TASKFLOW_API_CLIENTS:-local:dev-local-client-secret:*}
      TASKFLOW_API_KEY: ${TASKFLOW_API_KEY:-dev-local-key}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
